<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai Port Links</title>
<noscript><p><a href="terminal-th.html">ภาษาไทย</a> · <a href="terminal-en.html">English</a></p></noscript>
<script>
// One URL, two languages: English by default; ?lang=th opens the Thai version.
(function () {
  var lang = new URLSearchParams(location.search).get("lang") === "th" ? "th" : "en";
  fetch("terminal-" + lang + ".html", { cache: "no-cache" }).then(function (r) { return r.text(); }).then(function (html) {
    document.open(); document.write(html); document.close();
  }).catch(function () { location.replace("terminal-" + lang + ".html"); });
})();
</script>
